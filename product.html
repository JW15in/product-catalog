<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>後視鏡詳細資料</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--ink:#17181a;--muted:#656b73;--line:#e2e5e9;--dark:#171a20;--soft:#eef1f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
a{text-decoration:none;color:inherit}.wrap{max-width:1080px;margin:auto;padding:14px 14px 50px}.back{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:800;margin:5px 0 13px}
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:18px;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.gallery{padding:16px;background:#f2f3f4}.main-photo{position:relative;background:#fff;border-radius:14px;overflow:hidden;cursor:zoom-in}
.main-photo img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block}
.zoom-note{position:absolute;right:10px;bottom:10px;background:rgba(20,22,26,.78);color:#fff;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
.thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}
.thumb{border:2px solid transparent;border-radius:9px;overflow:hidden;background:#fff;cursor:pointer;padding:0}
.thumb.active{border-color:#171a20}.thumb img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.info{padding:25px 24px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#7a8088;font-weight:850}.info h1{font-size:38px;line-height:1.05;margin:8px 0 10px}
.summary{color:#555b63;line-height:1.65;margin-bottom:12px}.pricebox{font-size:26px;font-weight:900;margin:7px 0 16px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{background:var(--soft);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
.key{margin-top:20px;background:#171a20;color:#fff;border-radius:15px;padding:15px 16px;line-height:1.55}.key b{display:block;font-size:13px;color:#d8dde5;margin-bottom:4px}.key strong{font-size:20px}
.section{background:#fff;border:1px solid var(--line);border-radius:18px;margin-top:16px;padding:20px}.section h2{font-size:20px;margin:0 0 14px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}.row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}.row span:first-child{color:#6c727a}.row span:last-child{text-align:right;font-weight:700}
.points{margin:0;padding-left:20px;color:#4e545c;line-height:1.75}.fitbox{background:#f0f5f0;border:1px solid #dbe7dc;border-radius:14px;padding:15px 16px;line-height:1.6}.warn{margin-top:12px;background:#fff6e8;border:1px solid #f0dfbf;border-radius:14px;padding:14px 15px;line-height:1.6}

#notfound{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;padding:20px;align-items:center;justify-content:center}.modal.open{display:flex}.modal img{max-width:96vw;max-height:92vh;object-fit:contain}.close{position:fixed;right:18px;top:14px;color:#fff;font-size:34px;cursor:pointer}
@media(max-width:760px){.hero{grid-template-columns:1fr}.gallery{padding:10px}.info{padding:20px 17px}.info h1{font-size:32px}.specs{grid-template-columns:1fr}.wrap{padding:10px 10px 36px}.thumbs{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="index.html">← 回到全部款式</a>

<div id="page">
<section class="hero">
<div class="gallery">
  <div class="main-photo" id="mainPhoto"><img id="heroImg" alt=""><span class="zoom-note">點圖放大</span></div>
  <div class="thumbs" id="thumbs"></div>
</div>
<div class="info">

<h1 id="name"></h1>
<div class="summary" id="summary"></div><div class="pricebox" id="price"></div>
<div class="chips" id="chips"></div>
<div class="key"><b>Fitment</b><strong>1986–1992 Suzuki GSX-R</strong></div>
</div>
</section>

<section class="section"><h2>規格</h2><div class="specs" id="specs"></div></section>
<section class="section"><h2>這款的重點</h2><ul class="points" id="points"></ul></section>
<section class="section"><h2>Fitment</h2><div class="fitbox">1986–1992 Suzuki GSX-R</div></section>

</div>

<div id="notfound"><h2>找不到這個款式</h2><p>請回到型錄重新選擇。</p></div>
</main>

<div class="modal" id="modal"><div class="close" id="close">×</div><img id="modalImg" alt=""></div>

  return a;
}

oval:{price:3118,name:"OVAL",sku:"100109618280103",summary:"橢圓形全鋁鏡殼，使用非球面凸面鏡，外觀乾淨、視野取向。",chips:["26–55 mm","非球面鏡","3 關節","CNC 鋁"],specs:[["材質","CNC 鋁"],["形狀","Oval"],["鏡片","Aspheric convex lens"],["調整","3 個調整關節"],["安裝孔距","26–55 mm C2C"],["固定螺絲","M6"],["重量","約 667 g / 對"],["包裝","左右一對"]],points:["非球面凸面鏡提供較寬視野。","鏡面與鏡座皆可調。","全鋁結構，外型簡潔。"]},

};

const id=new URLSearchParams(location.search).get("id");
const p=products[id];
if(!p){document.getElementById("page").style.display="none";document.getElementById("notfound").style.display="block";}
else{
 document.title=p.name+" 後視鏡詳細資料";
 document.getElementById("name").textContent=p.name;
 document.getElementById("summary").textContent=p.summary; document.getElementById("price").textContent="NT$"+p.price.toLocaleString("en-US");
 document.getElementById("chips").innerHTML=p.chips.map(x=>'<span class="chip">'+x+'</span>').join("");
 document.getElementById("specs").innerHTML=p.specs.map(x=>'<div class="row"><span>'+x[0]+'</span><span>'+x[1]+'</span></div>').join("");
 document.getElementById("points").innerHTML=p.points.map(x=>'<li>'+x+'</li>').join("");

 const list=imgs(p.sku,p.fallback);
 const main=document.getElementById("heroImg");
 const thumbs=document.getElementById("thumbs");
 let loaded=0;
 list.forEach((src,i)=>{
   const b=document.createElement("button");b.className="thumb";
   const im=document.createElement("img");im.src=src;im.alt=p.name+" photo "+(i+1);
   im.onload=()=>{loaded++; if(!main.src || main.dataset.empty==="1"){main.src=src;main.dataset.empty="0";b.classList.add("active");}};
   im.onerror=()=>{b.remove(); if(main.src===src){main.dataset.empty="1";}};
   b.appendChild(im);b.onclick=()=>{main.src=src;document.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active"));b.classList.add("active");};
   thumbs.appendChild(b);
 });
 main.dataset.empty="1";
 document.getElementById("mainPhoto").onclick=()=>{if(main.src){document.getElementById("modalImg").src=main.src;document.getElementById("modal").classList.add("open");}};
}
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open");};
</script>
</body>
</html>
