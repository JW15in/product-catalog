name: Inspect KiWAV catalog source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/catalog-source-check.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'beautifulsoup4>=4.12,<5' playwright
      - run: python -m playwright install --with-deps chromium
      - name: Inspect public source in an ordinary browser
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright
          urls = {
            'search': 'https://kiwavmotors.com/en/search-result?q=Cls_FAD-10&start=0',
            'emperor': 'https://kiwavmotors.com/en/mirrors/fairing-sportsbike/emperor-black-fairing-mount-mirrors-w-black-adapter-for-sportsbike-detail',
            'palm': 'https://kiwavmotors.com/en/mirrors/fairing-sportsbike/palmii-black-mirrors-fairing-mount-with-black-adapter-detail'
          }
          out = Path('source-inspection'); out.mkdir()
          with sync_playwright() as pw:
            browser = pw.chromium.launch()
            page = browser.new_page(locale='en-US')
            for key, url in urls.items():
              response = page.goto(url, wait_until='domcontentloaded', timeout=60000)
              try:
                page.wait_for_selector('a[href*="-detail"], .productdetails-view', timeout=20000)
              except Exception:
                pass
              html = page.content()
              (out / (key + '.html')).write_text(html, encoding='utf-8')
              page.screenshot(path=str(out / (key + '.png')), full_page=True)
              soup = BeautifulSoup(html, 'html.parser')
              print('\nSOURCE', key, 'INITIAL STATUS', response.status if response else None, 'TITLE', page.title())
              if 'Just a moment' in page.title() or not soup.select('a[href*="-detail"], .productdetails-view'):
                raise RuntimeError('Source not accessible. Stop; do not solve challenges or publish incomplete data.')
              if key == 'search':
                a = next((a for a in soup.select('h2 a, h3 a') if '-detail' in a.get('href','')), None)
                if a:
                  for parent in list(a.parents)[:5]: print('ANCESTOR', parent.name, parent.attrs)
                  p = a
                  for _ in range(4): p = p.parent
                  print('FIRST CARD MARKUP', str(p)[:16000])
                print('PAGINATION', [str(n) for n in soup.select('.pagination, .vm-pagination')])
              else:
                for selector in ['h1', '.product-price', '[itemprop="offers"]', '.main-image', '.additional-images', '.product-description', '#product-description', '.product-fields', '.product-short-description']:
                  nodes = soup.select(selector)
                  print('SELECTOR', selector, 'COUNT', len(nodes))
                  for n in nodes[:2]: print(str(n)[:18000])
                print('JSONLD', [s.get_text() for s in soup.select('script[type="application/ld+json"]')])
                print('IMAGE ELEMENTS', [str(n) for n in soup.select('img') if '/products/' in str(n) or '/kiwavebay/' in str(n)])
            browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiwav-source-inspection
          path: source-inspection/
          retention-days: 7
