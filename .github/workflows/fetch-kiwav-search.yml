name: Fetch KiWAV Search Results

on:
  push:
    paths:
      - trigger-fetch.txt

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch search pages
        shell: bash
        run: |
          set -e
          mkdir -p out
          for start in 0 12 24 36 48; do
            url="https://kiwavmotors.com/en/search-result?q=Cls_FAD-10&start=$start"
            echo "FETCH $url"
            curl -L --fail --retry 2 -A "Mozilla/5.0" "$url" -o "out/page-$start.html"
          done
      - name: Extract likely product links and titles
        shell: bash
        run: |
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          import re, json
          rows=[]
          for p in sorted(Path("out").glob("page-*.html")):
              html=p.read_text(errors="ignore")
              soup=BeautifulSoup(html,"html.parser")
              for a in soup.find_all("a", href=True):
                  href=a.get("href","").strip()
                  txt=" ".join(a.stripped_strings).strip()
                  if not txt:
                      continue
                  if ("/en/all-products/" in href or "/en/mirrors/fairing-sportsbike/" in href) and "detail" in href:
                      rows.append({"page":p.name,"title":txt,"href":href})
          seen=set(); out=[]
          for r in rows:
              k=(r["title"],r["href"])
              if k not in seen:
                  seen.add(k); out.append(r)
          Path("out/products.json").write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: kiwav-search-results
          path: out/
