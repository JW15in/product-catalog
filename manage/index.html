<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>型錄管理</title><style>
:root{--bg:#f5f6f7;--ink:#17181a;--muted:#68707a;--line:#e1e4e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:auto;padding:28px 16px 60px}.head h1{margin:0 0 6px}.head p{margin:0;color:var(--muted);line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}select,input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}.toggle{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:9px 0}.toggle input{width:20px;height:20px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.item{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);border-radius:11px;padding:10px}.item input{width:18px;height:18px;margin-top:2px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.sold{color:#a32626;font-weight:800}.toolbar{display:flex;gap:8px;margin-bottom:10px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.secondary{background:#eef1f4}.primary{background:#171a20;color:#fff;width:100%;margin-top:10px}.status{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#eef1f4}.locked{padding:12px;border-radius:10px;background:#fff7dd;line-height:1.6}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}@media(max-width:600px){.products{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="head"><h1>Catalog Manager</h1><p>每一份車型型錄都有自己的顯示設定；修改其中一份不會影響其他型錄。</p></div><section class="panel"><label><strong>選擇型錄</strong></label><select id="catalog"></select></section><div id="editor"></div></main><script>
const repo='JW15in/product-catalog';let catalogs=[],current=null,products=[],cfg={};const $=id=>document.getElementById(id);function enc(s){return btoa(unescape(encodeURIComponent(s)))}function status(msg,ok=true){const x=$('status');if(!x)return;x.style.display='block';x.textContent=msg;x.style.background=ok?'#eef7ef':'#fff0f0'}async function init(){catalogs=await fetch('../catalogs.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());$('catalog').innerHTML=catalogs.map(c=>`<option value="${c.id}">${c.name}${c.locked?' 🔒':''}</option>`).join('');$('catalog').onchange=load;await load()}async function load(){current=catalogs.find(c=>c.id===$('catalog').value)||catalogs[0];if(current.locked){$('editor').innerHTML=`<section class="panel"><div class="locked"><strong>已鎖定 / Production</strong><br>${current.name} 為既有正式型錄。新版管理頁不提供修改功能。</div></section>`;return}products=await fetch('../'+current.path+'/products.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());cfg=await fetch('../'+current.path+'/config.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json());render()}function render(){$('editor').innerHTML=`<section class="panel"><h2>產品顯示</h2><div class="toolbar"><button class="secondary" id="allOn">全選</button><button class="secondary" id="allOff">全部取消</button></div><div class="products" id="products"></div></section><section class="panel"><h2>功能</h2><label class="toggle"><span>顯示已售罄商品</span><input id="showSoldOut" type="checkbox"></label><label class="toggle"><span>圖片點擊放大</span><input id="enableZoom" type="checkbox"></label><label class="toggle"><span>Detail 顯示重量（來源有重量時）</span><input id="showWeight" type="checkbox"></label></section><section class="panel"><h2>儲存到 GitHub</h2><input id="token" type="password" autocomplete="off" placeholder="Paste GitHub Personal Access Token"><div class="hint">Token 只用於本次瀏覽器操作，不會存進網站。</div><button class="primary" id="save">Save changes</button><div class="status" id="status"></div></section>`;const box=$('products');box.innerHTML=products.map(p=>`<label class="item"><input type="checkbox" data-id="${p.id}" ${!cfg.products||cfg.products[p.id]!==false?'checked':''}><span><strong>${p.shortName||p.name}</strong><div class="meta">${p.soldOut?'<span class="sold">已售罄</span>':''}</div></span></label>`).join('');$('showSoldOut').checked=cfg.showSoldOut!==false;$('enableZoom').checked=cfg.enableZoom!==false;$('showWeight').checked=cfg.showWeight!==false;$('allOn').onclick=()=>document.querySelectorAll('[data-id]').forEach(x=>x.checked=true);$('allOff').onclick=()=>document.querySelectorAll('[data-id]').forEach(x=>x.checked=false);$('save').onclick=save}async function save(){const token=$('token').value.trim();if(!token){status('請先輸入 GitHub token。',false);return}const next={products:{},showSoldOut:$('showSoldOut').checked,enableZoom:$('enableZoom').checked,showWeight:$('showWeight').checked};document.querySelectorAll('[data-id]').forEach(x=>next.products[x.dataset.id]=x.checked);const path=current.path+'/config.json',api='https://api.github.com/repos/'+repo+'/contents/'+path,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28'};try{status('正在讀取設定…');const r=await fetch(api,{headers});if(!r.ok)throw new Error('無法讀取 config.json ('+r.status+')');const old=await r.json();status('正在儲存…');const w=await fetch(api,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify({message:'Update '+current.name+' catalog settings',content:enc(JSON.stringify(next,null,2)),sha:old.sha,branch:'main'})});if(!w.ok)throw new Error('儲存失敗 ('+w.status+')');cfg=next;status('已儲存。GitHub Pages 更新後生效。')}catch(e){status(e.message||String(e),false)}}init();
</script></body></html>
